    player-not-found: "&c未找到玩家！"
    invalid-command: "&c无效命令！请使用 /blood help"
    player-only: "&c此命令仅供玩家使用！"
    no-data: "&c未找到血液数据！"
    invalid_type: "&c无效血型！请使用 A、B、AB 或 O"
    invalid_value: "&c无效数值！请使用数字"
    invalid_rh: "&c无效 RH 因子！请使用 + 或 -"