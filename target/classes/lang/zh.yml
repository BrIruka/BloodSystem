messages:
  prefix: "&7[&c血液系统&7]"
  blood:
    info: "&f血型：&c%bloodtype% %rhfactor%"
    volume: "&f血容量：&c%volume%&f 毫升"
    quality: "&f血液质量：&c%quality%&f%"
    set:
      type: "&a已将玩家 %player% 的血型更改为 &c%bloodtype% %rhfactor%"
      volume: "&a已将玩家 %player% 的血容量更改为 &c%volume% 毫升"
      quality: "&a已将玩家 %player% 的血液质量更改为 &c%quality%&a%"
      maxvolume: "&a已将玩家 %player% 的最大血容量设置为 &c%maxvolume% 毫升"
    add:
      volume: "&a已将玩家 %player% 的血容量增加 &c%amount% 毫升 &7(原先：&c%oldvolume% 毫升&7，现在：&c%volume% 毫升&7)"
      maxvolume: "&a已将玩家 %player% 的最大血容量增加 &c%amount% 毫升 &7(现在：&c%maxvolume% 毫升&7)"
    remove:
      volume: "&a已将玩家 %player% 的血容量减少 &c%amount% 毫升 &7(原先：&c%oldvolume% 毫升&7，现在：&c%volume% 毫升&7)"
      maxvolume: "&a已将玩家 %player% 的最大血容量减少 &c%amount% 毫升 &7(原先：&c%oldmaxvolume% 毫升&7，现在：&c%maxvolume% 毫升&7)"
  help:
    title: "&f可用命令："
    commands:
      blood: "&f/blood &7- 显示自己的血液信息"
      info: "&f/blood info [玩家] &7- 显示玩家的血液信息"
      help: "&f/blood help &7- 显示此消息"
      admin:
        title: "&c管理员命令："
        set_type: "&f/blood set type <玩家> <A|B|AB|O> [+|-] &7- 设置血型"
        set_volume: "&f/blood set volume <玩家> <数值> &7- 设置血容量"
        set_quality: "&f/blood set quality <玩家> <数值> &7- 设置血液质量"
        set_maxvolume: "&f/blood set maxvolume <玩家> <数值> &7- 设置最大血容量"
        add_volume: "&f/blood add volume <玩家> <数值> &7- 增加血容量"
        add_maxvolume: "&f/blood add maxvolume <玩家> <数值> &7- 增加最大血容量"
        remove_volume: "&f/blood remove volume <玩家> <数值> &7- 减少血容量"
        remove_maxvolume: "&f/blood remove maxvolume <玩家> <数值> &7- 减少最大血容量"
        reload: "&f/blood reload &7- 重新加载插件"
